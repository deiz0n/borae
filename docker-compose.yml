services:
  frontend:
    build:
      context: ./borae-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./borae-frontend/.env
    volumes:
      - ./borae-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
